name: Actualizar estadisticas

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Recolectar batallas
        run: node scripts/collect.mjs
        env:
          BRAWL_API_KEY: ${{ secrets.BRAWL_API_KEY }}
      - name: Guardar resultados
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/stats.json
          git diff --cached --quiet || (git commit -m "Actualizar estadisticas" && git push)
